<!doctype html><meta charset=utf8>
<style>html,body{margin:0;background:#0a0d1e;overflow:hidden}iframe{border:0;display:block}</style>
<iframe id=f src="/"></iframe>
<script>
  // hash: "<scroll>[,<faixaGrafico>][,<cardStat>][,<largura>][,<sheet>]"
  const [s, zone, card, w, sheet] = (location.hash.slice(1) || '0').split(',')
  f.style.width = (w || 430) + 'px'
  f.style.height = '932px'
  f.onload = () => {
    const d = f.contentDocument
    const el = d.querySelector('.screen')
    if (el) el.scrollTop = +s < 0 ? el.scrollHeight : +s
    if (card) d.querySelectorAll('.stats .card')[+card]?.click()
    if (sheet) {
      const sel = {
        koins: '.coins .chip:nth-of-type(1)',
        diamantes: '.coins .chip:nth-of-type(2)',
        config: '.actions button:nth-of-type(1)',
        notificacoes: '.actions button:nth-of-type(2)',
        niveis: '.link',
      }[sheet]
      d.querySelector(sel)?.click()
    }
    if (zone) requestAnimationFrame(() =>
      d.querySelectorAll('.chart .hit')[+zone]?.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true })))
  }
</script>
